<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Sprint｜考前讀書衝刺規劃器</title>
  <style>
    :root{
      --bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;
      --primary:#4f46e5;--primary-soft:#eef2ff;--success:#16a34a;
      --warning:#b45309;--danger:#dc2626;--border:#e5e7eb;
      --shadow:0 10px 30px rgba(31,41,55,.08);--radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
    .container{width:min(1120px,92%);margin:0 auto;padding:28px 0 48px}
    .hero{background:linear-gradient(135deg,#eef2ff 0%,#fff 55%,#f0fdf4 100%);border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:var(--shadow);margin-bottom:24px}
    .hero h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.04em}
    .hero p{margin:0;color:var(--muted);font-size:1.05rem}
    .grid{display:grid;grid-template-columns:1fr 1.2fr;gap:22px;align-items:start}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:22px}
    .card h2{margin:0 0 8px;font-size:1.3rem}
    .subtext{color:var(--muted);font-size:.92rem;margin:0 0 18px}
    label{display:block;font-weight:700;margin-bottom:6px;font-size:.92rem}
    input,select,button{font:inherit}
    input,select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;outline:none}
    input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .full{grid-column:1/-1}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    button{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:800;transition:.15s}
    button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(31,41,55,.10)}
    .primary{background:var(--primary);color:#fff}.secondary{background:var(--primary-soft);color:var(--primary)}.danger{background:#fef2f2;color:var(--danger)}
    .subject-list,.plan-list{display:grid;gap:12px;margin-top:16px}
    .subject-item{border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:14px;align-items:center}
    .subject-meta,.plan-info{color:var(--muted);font-size:.88rem;margin-top:4px}
    .tag{display:inline-block;background:var(--primary-soft);color:var(--primary);font-size:.8rem;font-weight:800;border-radius:999px;padding:4px 9px;margin-right:6px;margin-top:6px}
    .notice{border-radius:12px;padding:12px 14px;margin:12px 0 0;display:none;font-size:.94rem}.notice.show{display:block}
    .notice.warning{background:#fffbeb;color:var(--warning);border:1px solid #fde68a}.notice.error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}.notice.success{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0}
    .plan-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--border);border-radius:14px;padding:14px;background:#fff}
    .plan-item.done{opacity:.62;background:#f9fafb}.plan-item.done .plan-title{text-decoration:line-through}
    .plan-rank{width:34px;height:34px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:900}
    .plan-title{font-weight:800}.check-wrap input{width:20px;height:20px;accent-color:var(--success)}
    .progress-wrap{margin-top:18px}.progress-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}
    .progress-track{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#22c55e);transition:width .25s ease}
    .empty{color:var(--muted);text-align:center;padding:26px 10px;border:1px dashed var(--border);border-radius:14px;margin-top:16px}
    .summary-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.summary-chip{background:#f9fafb;border:1px solid var(--border);border-radius:999px;padding:7px 10px;font-size:.85rem;color:var(--muted)}
    footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:28px}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
<main class="container">
  <section class="hero">
    <h1>Exam Sprint</h1>
    <p>今天，把最重要的先完成。輸入可用時間與科目條件，快速排出今天的讀書順序。</p>
  </section>

  <div class="grid">
    <section>
      <div class="card">
        <h2>1. 今日設定</h2>
        <p class="subtext">先決定今天總共有多少時間可以使用。</p>
        <label for="availableTime">今日可用讀書時間（分鐘）</label>
        <input id="availableTime" type="number" min="1" placeholder="例如：180" value="180">
        <div id="settingNotice" class="notice"></div>
      </div>

      <div class="card">
        <h2>2. 新增科目</h2>
        <p class="subtext">輸入預估時間、重要程度與難度，系統會計算優先分數。</p>
        <div class="form-grid">
          <div class="full">
            <label for="subjectName">科目名稱</label>
            <input id="subjectName" type="text" placeholder="例如：計算機組織">
          </div>
          <div>
            <label for="subjectTime">預估時間（分鐘）</label>
            <input id="subjectTime" type="number" min="1" placeholder="例如：60">
          </div>
          <div>
            <label for="importance">重要程度（1～5）</label>
            <select id="importance">
              <option value="1">1 - 低</option><option value="2">2</option><option value="3" selected>3 - 中</option><option value="4">4</option><option value="5">5 - 高</option>
            </select>
          </div>
          <div>
            <label for="difficulty">難度（1～5）</label>
            <select id="difficulty">
              <option value="1">1 - 簡單</option><option value="2">2</option><option value="3" selected>3 - 中</option><option value="4">4</option><option value="5">5 - 困難</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="addSubjectBtn">＋ 新增科目</button>
          <button class="secondary" id="loadDemoBtn">載入示範資料</button>
        </div>
        <div id="subjectNotice" class="notice"></div>
        <div id="subjectList" class="subject-list"></div>
      </div>
    </section>

    <section>
      <div class="card">
        <h2>3. 今日讀書計畫</h2>
        <p class="subtext">優先分數 = 重要程度 × 2 + 難度。若分數相同，預估時間較短者優先。</p>
        <div class="actions">
          <button class="primary" id="generateBtn">✨ 產生今日計畫</button>
          <button class="danger" id="clearBtn">清除全部</button>
        </div>
        <div id="planNotice" class="notice"></div>
        <div id="planSummary" class="summary-row"></div>
        <div id="planList" class="plan-list"><div class="empty">尚未產生計畫，先新增科目吧。</div></div>

        <div class="progress-wrap">
          <div class="progress-head"><span>今日完成進度</span><span id="progressText">0%</span></div>
          <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        </div>
      </div>
    </section>
  </div>

  <footer>Exam Sprint V1｜單一 index.html 練習作品</footer>
</main>

<script>
  const subjects = [];
  let currentPlan = [];

  const availableTimeInput = document.getElementById("availableTime");
  const subjectNameInput = document.getElementById("subjectName");
  const subjectTimeInput = document.getElementById("subjectTime");
  const importanceSelect = document.getElementById("importance");
  const difficultySelect = document.getElementById("difficulty");
  const subjectList = document.getElementById("subjectList");
  const planList = document.getElementById("planList");
  const planSummary = document.getElementById("planSummary");
  const progressBar = document.getElementById("progressBar");
  const progressText = document.getElementById("progressText");
  const settingNotice = document.getElementById("settingNotice");
  const subjectNotice = document.getElementById("subjectNotice");
  const planNotice = document.getElementById("planNotice");

  function showNotice(element,message,type="warning"){
    element.className=`notice show ${type}`;
    element.textContent=message;
  }
  function hideNotice(element){element.className="notice";element.textContent=""}
  function calculatePriority(importance,difficulty){return importance*2+difficulty}
  function escapeHtml(text){
    return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  function addSubject(name,time,importance,difficulty){
    subjects.push({
      id:(window.crypto && crypto.randomUUID)?crypto.randomUUID():String(Date.now()+Math.random()),
      name,time,importance,difficulty,
      priority:calculatePriority(importance,difficulty)
    });
    renderSubjects();
  }

  function renderSubjects(){
    if(subjects.length===0){
      subjectList.innerHTML='<div class="empty">目前還沒有科目。</div>';
      return;
    }
    subjectList.innerHTML=subjects.map(s=>`
      <div class="subject-item">
        <div>
          <strong>${escapeHtml(s.name)}</strong>
          <div class="subject-meta">預估 ${s.time} 分鐘</div>
          <div>
            <span class="tag">重要 ${s.importance}</span>
            <span class="tag">難度 ${s.difficulty}</span>
            <span class="tag">優先分數 ${s.priority}</span>
          </div>
        </div>
        <button class="danger" onclick="removeSubject('${s.id}')">刪除</button>
      </div>
    `).join("");
  }

  function removeSubject(id){
    const i=subjects.findIndex(s=>String(s.id)===String(id));
    if(i!==-1){
      subjects.splice(i,1);
      renderSubjects();
      currentPlan=[];
      renderPlan();
    }
  }

  function generatePlan(){
    hideNotice(settingNotice);hideNotice(planNotice);
    const availableTime=Number(availableTimeInput.value);

    if(!availableTime||availableTime<=0){
      showNotice(settingNotice,"請先輸入大於 0 的今日可用讀書時間。","error");
      return;
    }
    if(subjects.length===0){
      showNotice(planNotice,"目前沒有科目，請先新增至少一個科目。","error");
      return;
    }

    const sorted=[...subjects].sort((a,b)=>{
      if(b.priority!==a.priority)return b.priority-a.priority;
      return a.time-b.time;
    });

    let remaining=availableTime;
    currentPlan=[];

    for(const subject of sorted){
      if(subject.time<=remaining){
        currentPlan.push({...subject,completed:false});
        remaining-=subject.time;
      }
    }

    const totalNeeded=subjects.reduce((sum,s)=>sum+s.time,0);

    if(currentPlan.length===0){
      showNotice(planNotice,"目前可用時間不足以安排任何一個完整科目，建議縮短單科預估時間。","warning");
    }else if(totalNeeded>availableTime){
      showNotice(planNotice,`所有科目共需 ${totalNeeded} 分鐘，但今天只有 ${availableTime} 分鐘，已優先安排重要項目。`,"warning");
    }else{
      showNotice(planNotice,"今天的時間足夠完成所有科目，已完成排序。","success");
    }
    renderPlan();
  }

  function renderPlan(){
    if(currentPlan.length===0){
      planList.innerHTML='<div class="empty">尚未產生計畫，先新增科目吧。</div>';
      planSummary.innerHTML="";
      updateProgress();
      return;
    }

    const totalMinutes=currentPlan.reduce((sum,item)=>sum+item.time,0);
    planSummary.innerHTML=`
      <span class="summary-chip">安排 ${currentPlan.length} 個科目</span>
      <span class="summary-chip">共 ${totalMinutes} 分鐘</span>
    `;

    planList.innerHTML=currentPlan.map((item,index)=>`
      <div class="plan-item ${item.completed?"done":""}">
        <div class="plan-rank">${index+1}</div>
        <div>
          <div class="plan-title">${escapeHtml(item.name)}</div>
          <div class="plan-info">${item.time} 分鐘｜優先分數 ${item.priority}</div>
        </div>
        <label class="check-wrap">
          <input type="checkbox" ${item.completed?"checked":""}
            onchange="toggleComplete('${item.id}')"
            aria-label="完成 ${escapeHtml(item.name)}">
        </label>
      </div>
    `).join("");

    updateProgress();
  }

  function toggleComplete(id){
    const item=currentPlan.find(x=>String(x.id)===String(id));
    if(!item)return;
    item.completed=!item.completed;
    renderPlan();
  }

  function updateProgress(){
    if(currentPlan.length===0){
      progressBar.style.width="0%";
      progressText.textContent="0%";
      return;
    }
    const completed=currentPlan.filter(x=>x.completed).length;
    const percent=Math.round(completed/currentPlan.length*100);
    progressBar.style.width=`${percent}%`;
    progressText.textContent=`${percent}%`;
  }

  function clearAll(){
    subjects.splice(0,subjects.length);
    currentPlan=[];
    renderSubjects();renderPlan();
    hideNotice(planNotice);hideNotice(subjectNotice);hideNotice(settingNotice);
  }

  document.getElementById("addSubjectBtn").addEventListener("click",()=>{
    hideNotice(subjectNotice);
    const name=subjectNameInput.value.trim();
    const time=Number(subjectTimeInput.value);
    const importance=Number(importanceSelect.value);
    const difficulty=Number(difficultySelect.value);

    if(!name){showNotice(subjectNotice,"請輸入科目名稱。","error");return}
    if(!time||time<=0){showNotice(subjectNotice,"預估時間必須大於 0 分鐘。","error");return}

    addSubject(name,time,importance,difficulty);
    subjectNameInput.value="";subjectTimeInput.value="";
    importanceSelect.value="3";difficultySelect.value="3";
    showNotice(subjectNotice,`已新增「${name}」。`,"success");
  });

  document.getElementById("generateBtn").addEventListener("click",generatePlan);

  document.getElementById("clearBtn").addEventListener("click",()=>{
    if(confirm("確定要清除所有科目與讀書計畫嗎？"))clearAll();
  });

  document.getElementById("loadDemoBtn").addEventListener("click",()=>{
    if(subjects.length>0){
      showNotice(subjectNotice,"目前已有科目，請先清除後再載入示範資料。","warning");
      return;
    }
    addSubject("計算機組織",60,5,4);
    addSubject("作業系統",50,5,5);
    addSubject("日文",40,3,2);
    addSubject("資訊安全",45,4,4);
    showNotice(subjectNotice,"已載入示範資料，可以直接產生今日計畫。","success");
  });

  renderSubjects();
  updateProgress();
</script>
</body>
</html>
